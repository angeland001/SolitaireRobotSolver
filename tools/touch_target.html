<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Touch Target</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint { position: fixed; left: 50%; top: 45%; transform: translateX(-50%);
          font: 18px -apple-system, sans-serif; color: #999; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Calibration target: every touch leaves a black dot.<br>Three-finger tap clears.</div>
<script>
  // Used by tools/calibrate.py: the plotter taps, this page draws a dot, the
  // mirrored screen shows where the tap really landed.
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  function resize() {
    const r = window.devicePixelRatio || 1;
    c.width = innerWidth * r; c.height = innerHeight * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  }
  addEventListener("resize", resize); resize();
  addEventListener("touchstart", e => {
    e.preventDefault();
    if (e.touches.length >= 3) { resize(); return; }
    document.getElementById("hint").style.display = "none";
    ctx.fillStyle = "#000";
    for (const t of e.changedTouches) {
      ctx.beginPath(); ctx.arc(t.clientX, t.clientY, 14, 0, 2 * Math.PI); ctx.fill();
    }
  }, { passive: false });
</script>
</body>
</html>
