screen:
  # iPad Air 11" (M2), portrait. Native pixels = 2x points.
  width_px: 1640
  height_px: 2360
  scale: 2
  ppi: 264                    # Apple spec; 1640x2360 px = 157.8 x 227.1 mm of glass

capture:
  source: window              # window (AirPlay receiver) | camera (HDMI capture card / OBS) | monitor
  # Receiver window title(s), first match wins: AirServer, then the old free receiver's two titles (see live_view.py --list-windows)
  window_title: ["AirServer", "AirPlay - Screen Mirroring Receiver", "AirMirroring"]
  camera_index: 1             # 0 is usually the laptop webcam
  monitor: 1
  rotate: 0                   # 0/90/180/270, if the mirror shows the iPad sideways
  black_threshold: 20         # pixels darker than this count as letterbox bars
  aspect_tolerance: 0.02      # crop w/h must be within 2% of 1640/2360

plotter:
  port: auto                  # auto = find by usb_ids; or a fixed name like COM7 (--port overrides)
  usb_ids: ["1A86:7523"]      # VID:PID of the UNO clone's CH340 USB-serial chip
  baud: 115200
  pen_up: "M3 S0"             # from the 2025 prototype; tune with plotter_console.py
  pen_down: "M3 S90"
  servo_settle_s: 0.10        # wait after a pen move so the servo arrives (0.15 until 2026-11-24; back to 0.15 if taps start missing)
  tap_dwell_s: 0.08           # time the tip rests on the glass during a tap
  drag_feed: 2500             # mm/min for pen-down drags (was 1500)
  travel_feed: 8000           # mm/min for pen-up moves (3000 -> 6000 -> 8000 on 2026-11-24 after a clean 70-move v3 game). 8000 = GRBL $110/$111, the ceiling unless those are raised. With axis_moves every move is straight, so both motors run at this feed. If taps start landing off by equal X and Y amounts, go back to 6000
  axis_moves: true            # true = X then Y, no diagonals (back on 2026-11-23: first live game missed its first target after a +X+Y diagonal). false = diagonal moves (fast, but the X+Y motor slipped on 2026-11-11); also applies to drags
  jog_step_mm: 5

layout:
  # Fractions of screen width/height, measured from the 10k dataset boxes.
  top_row_max_y: 0.25         # a box whose top edge is above this is in the top row
  column_x: [0.186, 0.290, 0.394, 0.498, 0.601, 0.705, 0.808]
  column_tolerance: 0.035     # max |box centre - column centre| to belong to a column
  foundation_x: [0.186, 0.290, 0.394, 0.498]
  waste_x_range: [0.55, 0.76] # the fan of up to 3 cards; right-most is playable
  stock_x: 0.808
  bottom_y: 0.80              # ignore boxes below this (button bar)
  # Tap/drop targets for places with no detection box (executor). Medians of the dataset labels, 2026-11-23.
  stock_y: 0.194              # stock centre: tapped when it shows the recycle icon (no box)
  foundation_y: 0.194         # foundation slot centre
  tableau_top_y: 0.283        # top edge of a column's first card
  card_height: 0.095          # a fully visible card's box; empty-column drop = tableau_top_y + card_height/2
  finish_button: [0.500, 0.909]  # x, y centre, read off IMG_0472
  undo_button: [0.765, 0.909]

vision:
  # Raw Label Studio YOLO export (images/, labels/, classes.txt). Kept outside the repo.
  dataset_dir: C:/Users/rvj412/Downloads/Yolo/YoloSolitaire
  # Label Studio review project built by tools/make_review.py; its parent folder is the
  # LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT (kept outside the repo, like the dataset)
  review_dir: C:/Users/rvj412/Downloads/Yolo/review
  # Generated split + data.yaml (git-ignored)
  prepared_dir: datasets/yolo_solitaire
  val_fraction: 0.15          # picks the best epoch during training
  test_fraction: 0.15         # never seen during training; final score only
  split_block_size: 6         # consecutive screenshots kept together to avoid train/val leakage
  base_model: yolo11s.pt
  imgsz: 1280
  epochs: 150
  batch: 4                    # 8 at imgsz 1280 overflowed the 8 GB GPU into system RAM
  workers: 2
  weights: models/cards.pt    # best weights copied here after training
  conf_threshold: 0.5

repair:
  # StateBuilder fixes for misreads the rules pin down (README §4.2).
  duplicate_conf_margin: 0.15 # a card read twice: rename the weaker copy to its same-colour sibling only if it is this much less confident (live case: 0.69 vs 0.95)

stability:
  # Multi-frame agreement (solitaire/state/stable.py): trust a board only after this many
  # consecutive valid reads agree. Removes shimmer misreads and mid-animation frames.
  agree_frames: 3
  max_invalid_between: 3       # invalid reads skipped (not counted) between agreeing ones; more in a row start over. 0 = any invalid read starts over (before 2026-11-24, when a flickering 6d strip kept a board from ever settling)
  read_timeout_s: 3.0         # give up on a stable read after this long (mirror dropped, menu on screen)
  change_timeout_s: 3.0       # after a tap, wait this long for the board to change before calling it a miss (2.0 once timed out on a tap that had registered, and the retry made a second move)
  frame_interval_s: 0.0       # pause between reads; 0 = as fast as detection runs

game:
  # The control loop (solitaire/main.py).
  max_unreadable: 5           # consecutive failed stable reads (stability.read_timeout_s each) before stopping
  max_missed_moves: 2         # retries when a move leaves the board unchanged; then re-aim (live, asks you) or stop
  settle_after_waste_s: 0.5   # pause after a waste move or recycle before the next tap: the waste fan is still sliding and the app ignores taps (16 of 18 missed taps on 2026-11-24 came right after one)
  retry_nudges: [0.0, 0.3, -0.3]  # try k touches the card this fraction of its box height lower (+) / higher (-): drift of a few mm lands on the neighbour strip
  press_finish: true          # press Finish when the solver is stuck (false = just stop). Back on 2026-11-23 after the retrain (cards-3) and the card-accounting check; it was off because a misread waste card once made a game look stuck
  bounds_margin_mm: 2         # the plotter refuses targets closer than this to the screen edge
  notify_win: true            # banner + beeps when a game ends won (incl. the app auto-finishing once no face-down card is left)
  log_dir: runs/games         # one log per game: every move, and every move that landed somewhere unexpected
  misread_dir: captures/misreads  # frames the detector misread (vs the stable board), PNG + JSON, for labelling

solver:
  max_recycles: null          # times the waste can go back into the stock; null = unknown (README §6 TODO), only "stuck" stops it
  mismatch_tries: 2           # MISMATCHes before a move is blocked for the game (1 if its board needed a repair); blocked moves get one more try before "stuck"
  weights:                    # heuristic scores (solitaire/solver/heuristic.py); higher = played first
    foundation: 60            # any card to a foundation (the app's points)
    safe_foundation: 40       # extra when no tableau card could still need it (Aces, 2s, or opposite colours caught up)
    reveal: 50                # move turns over a face-down card
    reveal_per_hidden: 5      # extra per face-down card in that column (dig the deepest first)
    empty_column_for_king: 30 # empty a column while a King is waiting for it
    unblock_foundation: 25    # split a run so the card under it can go to a foundation
    waste_to_tableau: 20
    drag_penalty: 5           # a drag is slower than a tap (5-minute clock)
  draw_count: 3               # cards per stock tap
  plan:                       # v2 lookahead over the remembered stock order (solitaire/solver/planner.py)
    enabled: true             # false = v1 heuristic only
    beam_width: 300           # lines kept at each depth of the search
    max_depth: 60             # moves looked ahead at most (a full stock pass is ~8 draws)
    max_seconds: 1.0          # search time per move at most; when it runs out, it plays the best line found so far
    discount: 0.01            # a gain k moves ahead counts (1 - k*discount): do useful things first
    # Weights tuned with tools/simulate_games.py (2026-11-23, 300 random deals): these won 61
    # (mean 16.6 foundation cards); v1 won 33 (12.2); the first guess (unsafe 3, reveal 8, peek 1) 41.
    foundation: 10            # per card on a foundation
    unsafe_foundation: 8      # per rank a foundation runs ahead of the other colour's lower suit + 2 (keep < foundation)
    reveal: 14                # per face-down card turned over
    talon_played: 0.5         # per card out of the stock/waste
    empty_column: 0.5         # per empty column
    peek: 3                   # drawing an unknown stock card into view
    move_cost: 0.1            # every move takes plotter time
    drag_cost: 0.3            # extra for a drag
  v3:                         # solver v3 (solitaire/solver/sampling.py, run with `python -m solitaire.main_v3`); v2 ignores this
    enabled: true             # false = SolverV3 behaves exactly like v2
    samples: 12               # random deals of the hidden cards planned per move
    beam_width: 40            # per-world search (weights come from solver.plan)
    max_depth: 30
    max_seconds: 2.0          # all worlds together; when it runs out, the worlds done so far vote
    peek: true                # look under a card with Undo: play the flip, read it, Undo (README §3.4)
    max_peeks: 12             # per game (each peek costs a move + an Undo on the clock)
    peek_margin: 15           # peek only at a flip that scores within this of the best move (null = any flip)

calibration:
  max_check_error_px: 30      # calibrate.py refuses to save if a check tap misses by more (a card strip is ~60 px tall)
  min_grid_lines: 3           # found dots must span at least this many grid rows AND columns
  mirror_settle_s: 1.0        # wait after a tap before looking for its dot; 0.4 missed dots with AirServer's lag
